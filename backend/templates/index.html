<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HKJC 足球價值投注系統</title>
<style>
 body{font-family:-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;margin:0;background:#0f1116;color:#e8ecf1}
 header{padding:14px 16px;background:#161a22;display:flex;justify-content:space-between;align-items:center}
 h1{font-size:16px;margin:0} .muted{color:#8b95a5;font-size:12px}
 .wrap{padding:12px 16px 60px;max-width:900px;margin:0 auto}
 .card{background:#161a22;border-radius:12px;padding:12px 14px;margin-bottom:12px}
 .kpi{display:flex;gap:18px;flex-wrap:wrap}
 .kpi div{min-width:110px} .kpi b{font-size:20px;display:block}
 table{width:100%;border-collapse:collapse;font-size:13px}
 th,td{text-align:left;padding:6px 4px;border-bottom:1px solid #232936}
 .pos{color:#4ade80}.neg{color:#f87171}.tag{background:#243044;border-radius:6px;padding:1px 6px;font-size:11px}
 .val{color:#fbbf24}
</style></head><body>
<header><h1>⚽ HKJC 足球價值投注系統</h1><span class="muted">v{{ version }}</span></header>
<div class="wrap">
  <div class="card">
    <div class="kpi" id="kpi"></div>
    <div class="muted" id="cfg" style="margin-top:8px"></div>
  </div>
  <div class="card"><h3>今日價值建議</h3><div id="value"></div></div>
  <div class="card"><h3>落注記錄（虛擬 / 真實分開）</h3><div id="bets"></div><div class="muted" style="margin-top:6px;line-height:1.7">盤口說明：<b>主客和</b> = 全場賽果，H 主勝（左邊嗰隊）／D 和／A 客勝（右邊嗰隊）；<b>入球大細 3.5 細</b> = 兩隊總入球 0–3 球，<b>大</b> = 4 球或以上；4.5 細 = 0–4 球、2.5 細 = 0–2 球。</div></div>
  <div class="card"><h3>賽程</h3><div id="fixtures"></div></div>
  <div class="card"><h3 style="display:flex;justify-content:space-between;align-items:center">
    <span>📒 投注記錄</span>
    <a href="/ledger.csv" style="font-size:12px;color:#8b95a5;text-decoration:none">下載 CSV ⬇</a></h3>
    <div class="muted" id="ledger_sum"></div><div id="ledger"></div></div>
  <div class="card"><h3 style="display:flex;justify-content:space-between;align-items:center">
    <span>🩺 自我檢查</span>
    <span><button id="doc_btn" style="margin-right:6px">檢查</button><button id="doc_fix">自動修正</button></span></h3>
    <div class="muted" id="doctor">撳「檢查」逐項報告：token 有冇效、webhook 有冇搶訊息、
      發／收訊息通唔通、資料庫同排程狀態（會發一條測試訊息去 Telegram）。
      見到有問題就撳「自動修正」。</div></div>
</div>
<script>
const f=n=>n==null?'-':Number(n).toFixed(2);
const ML={HAD:'主客和',TTG:'入球大細'},SL={H:'主勝',D:'和',A:'客勝',OVER:'大',UNDER:'細'};
const mk=x=>`${ML[x.market]||x.market}${x.line?' '+x.line:''} · ${SL[x.selection]||x.selection}`;
const sc=x=>x.home_score==null?'-':`${x.live_status?x.live_status+' ':''}${x.home_score}-${x.away_score}`;
async function load(){
  const s=await (await fetch('/api/status')).json();
  const p=s.paper,r=s.real;
  document.getElementById('kpi').innerHTML=`
    <div><span class="muted">自動跟注 ROI</span><b class="${(p.roi_pct||0)>=0?'pos':'neg'}">${p.roi_pct==null?'-':(p.roi_pct*100).toFixed(2)+'%'}</b></div>
    <div><span class="muted">盈虧</span><b class="${(p.pnl||0)>=0?'pos':'neg'}">$${f(p.pnl)}</b></div>
    <div><span class="muted">注數</span><b>${p.bets}</b></div>
    <div><span class="muted">命中率</span><b>${p.hit_rate==null?'-':(p.hit_rate*100).toFixed(1)+'%'}</b></div>
    <div><span class="muted">平均 CLV</span><b>${p.avg_clv_pct==null?'-':(p.avg_clv_pct*100).toFixed(2)+'%'}</b></div>
    <div><span class="muted">你實際落注 ROI</span><b>${r.roi_pct==null?'-':(r.roi_pct*100).toFixed(2)+'%'}</b></div>`;
  const c=s.config; document.getElementById('cfg').textContent=
    `市場 ${c.markets.join('/')} · EV 門檻 ${(c.ev_threshold*100).toFixed(1)}% · ${c.staking_mode} · 自動跟注 ${c.auto_follow?'開':'關'} · 上次掃描 ${(s.jobs.scan||{}).ts||'-'}`;
  const v=await (await fetch('/api/value')).json();
  document.getElementById('value').innerHTML= v.length? `<table><tr><th>時間</th><th>賽事</th><th>盤</th><th>賠率</th><th>EV</th><th>注碼</th></tr>`+
    v.map(x=>`<tr><td>${(x.kickoff_hk||'').slice(5)}</td><td>${x.home_team} vs ${x.away_team}</td>
      <td>${mk(x)}</td><td>${f(x.hkjc_odds)}</td>
      <td class="val">${(x.ev_pct*100).toFixed(1)}%</td><td>$${f(x.stake)}</td></tr>`).join('')+`</table>`:'冇';
  const b=await (await fetch('/api/bets')).json();
  const grp=m=>b.filter(x=>(x.mode||'paper')===m);
  const stat=rows=>{const st=rows.reduce((a,x)=>a+(x.stake||0),0);
    const se=rows.filter(x=>x.payout!=null);
    const pnl=se.reduce((a,x)=>a+((x.payout||0)-(x.stake||0)),0);
    return `注數 ${rows.length}・總注碼 $${f(st)}・已結算 ${se.length}・盈虧 <b class="${pnl>=0?'pos':'neg'}">$${f(pnl)}</b>`;};
  const tbl=rows=>rows.length?`<table><tr><th>#</th><th>開賽</th><th>賽事</th><th>比分</th><th>盤</th><th>賠率</th><th>注碼</th><th>狀態</th><th>盈虧</th></tr>`+
    rows.map(x=>{const pnl=(x.payout==null)?'':('$'+f((x.payout||0)-(x.stake||0)));
      return `<tr><td>${x.id}</td><td>${(x.kickoff_hk||'').slice(5)}</td>
      <td>${x.home_team||''} vs ${x.away_team||''}</td>
      <td>${sc(x)}</td><td>${mk(x)}</td><td>${f(x.odds_taken)}</td>
      <td>$${f(x.stake)}</td><td>${x.status}</td>
      <td class="${pnl&&!pnl.startsWith('$-')?'pos':''}">${pnl}</td></tr>`;}).join('')+`</table>`:'冇記錄';
  document.getElementById('bets').innerHTML=
    `<div style="margin-bottom:10px"><b>🧪 虛擬（系統自動跟注，唔係真錢）</b><div class="muted">${stat(grp('paper'))}</div>${tbl(grp('paper'))}</div>`+
    `<div style="border-top:1px solid #232936;padding-top:8px"><b>💰 真實（你自己落注）</b><div class="muted">${stat(grp('real'))}</div>${tbl(grp('real'))}</div>`;
  const fx=await (await fetch('/api/fixtures')).json();
  document.getElementById('fixtures').innerHTML= fx.length? `<table><tr><th>開賽</th><th>賽事</th><th>聯賽</th><th>狀態</th></tr>`+
    fx.slice(0,40).map(x=>`<tr><td>${(x.kickoff_hk||'').slice(5)}</td><td>${x.home_team} vs ${x.away_team}</td>
      <td>${x.league||''}</td><td>${x.status}</td></tr>`).join('')+`</table>`:'冇';
  const lg=await (await fetch('/api/ledger')).json();
  const st=s=>s.bets?`${s.bets} 注（已結算 ${s.graded}）・投注 $${(s.staked||0).toFixed(0)}・回收 $${(s.returned||0).toFixed(0)}・盈虧 <b class="${(s.pnl||0)>=0?'pos':'neg'}">$${(s.pnl||0).toFixed(0)}</b>・ROI ${s.roi_pct==null?'-':(s.roi_pct*100).toFixed(2)+'%'}`:'冇注項';
  document.getElementById('ledger_sum').innerHTML=`🤖 自動跟注：${st(lg.paper)}<br>✍️ 你實際落注：${st(lg.real)}`;
  const sl={open:'⏳',won:'✅',lost:'❌',push:'↩️',void:'🚫'};
  document.getElementById('ledger').innerHTML= lg.rows.length? `<table><tr><th>#</th><th>時間</th><th>賽事</th><th>市場</th><th>賠率</th><th>注碼</th><th>狀態</th><th>盈虧</th><th>CLV</th></tr>`+
    lg.rows.slice(0,30).map(x=>{
      const p=(x.status==='won'||x.status==='lost'||x.status==='push')?((x.payout||0)-(x.stake||0)):null;
      return `<tr><td>${x.id}</td><td>${(x.kickoff_hk||x.created_at||'').slice(5,16)}</td>
      <td>${x.home_team||''} vs ${x.away_team||''} <span class="tag">${x.mode==='real'?'✍️':'🤖'}</span></td>
      <td>${mk(x)}</td><td>${f(x.odds_taken)}</td>
      <td>$${f(x.stake)}</td><td>${sl[x.status]||x.status}</td>
      <td class="${p==null?'':(p>=0?'pos':'neg')}">${p==null?'':(p>0?'+':'')+p.toFixed(0)}</td>
      <td>${x.clv_pct==null?'-':(x.clv_pct*100).toFixed(1)+'%'}</td></tr>`;}).join('')+`</table>`:'冇注項記錄';
}
const IC={ok:'✅',warn:'⚠️',fail:'❌',skip:'➖'};
async function runDoctor(fix){
  const el=document.getElementById('doctor');
  el.textContent='檢查中…（幾秒）';
  let j;
  try{ j=await (await fetch('/api/doctor?send=1'+(fix?'&fix=1':''))).json(); }
  catch(e){ el.textContent='檢查失敗：'+e; return; }
  const fixed=(j.fixed||[]).map(f=>`${f.ok?'✅':'❌'} ${f.action}：${f.detail}`).join('<br>');
  el.innerHTML=(fixed?`<div class="muted" style="margin-bottom:6px">自動修正：<br>${fixed}</div>`:'')+
    j.items.map(i=>`<div style="margin-bottom:6px"><b>${IC[i.status]||'•'} ${i.title}</b>`
      +(i.detail?`<div class="muted" style="white-space:pre-wrap">${i.detail}</div>`:'')
      +((i.fix&&i.status!=='ok')?`<div style="color:#fbbf24">↳ 點修：${i.fix}</div>`:'')+`</div>`).join('')
    +`<div style="border-top:1px solid #232936;margin-top:8px;padding-top:6px"><b>總結</b>`
    +(j.verdict||[]).map(v=>`<div style="margin-top:4px">${v}</div>`).join('')+`</div>`;
}
document.getElementById('doc_btn').onclick=()=>runDoctor(false);
document.getElementById('doc_fix').onclick=()=>runDoctor(true);
load(); setInterval(load, 60000);
</script></body></html>
